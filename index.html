        @page {

        }
        @media print {
            /* 1. 强制锁死 html 和 body 尺寸，彻底斩断任何因系统字体精度造成的微小溢出 */
            html, body {
                margin: 0 !important;
                padding: 0 !important;
                height: 296mm !important; /* 主动缩短1mm作为安全缓冲 */
                overflow: hidden !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                page-break-inside: avoid !important; /* 强制禁止内部发生分页行为 */
            }
            /* 2. 隐藏控制台按钮 */
            .no-print { display: none !important; }

                width: 210mm !important;
                height: 296mm !important; /* 主动缩短1mm作为安全缓冲 */
                margin: 0 !important;
                box-shadow: none !important;
                overflow: hidden !important;
                background-color: white !important;
                page-break-after: avoid !important;
                page-break-inside: avoid !important;
            }
        }
        body { background-color: #f3f4f6; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .resume-page {
            width: 210mm;
            height: 297mm;
            background: #fff;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);

            position: relative;

            width: 210mm !important;
            height: 297mm !important;
            margin: 0 !important;
            box-shadow: none !important;
            background: #fff !important;
        }
        /* 严苛控制高密度一页纸的文本行高与字号 */
        .text-dense { font-size: 11.5px; line-height: 1.5; }
        .text-dense-title { font-size: 13.5px; font-weight: 700; }

        }

        function toggleLang() {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            document.getElementById('btn-lang').innerText = currentLang === 'zh' ? '英文' : '中文';
            document.getElementById('btn-export').innerText = currentLang === 'zh' ? '导出PDF' : 'Export PDF';
            renderResume();
        }

        function exportPdf() {
            const oldTitle = document.title;
            const button = document.getElementById('btn-export');
            const oldButtonText = button ? button.innerText : '';

            // Chrome / Edge 在“另存为 PDF”时通常以 document.title 作为默认文件名。
            document.title = '徐超的简历';
            if (button) {
                button.innerText = currentLang === 'zh' ? '正在打开导出…' : 'Opening PDF export…';
                button.disabled = true;
            }

            // 给浏览器一个渲染周期，确保 @media print 样式和当前简历布局已经稳定。
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    window.print();

                    // print() 返回后恢复网页标题和按钮状态。
                    setTimeout(() => {
                        document.title = oldTitle;
                        if (button) {
                            button.innerText = oldButtonText || (currentLang === 'zh' ? '导出PDF' : 'Export PDF');
                            button.disabled = false;
                        }
                    }, 300);
                });
            });
        }

            currentLayout = currentLayout === 'split' ? 'single' : 'split';

            renderResume();
        }

                            <h2 class="text-dense-title uppercase tracking-wide text-slate-900 bg-slate-100 px-2 py-0.5 mb-1.5">${data.impactTitle}</h2>
                            <p class="text-slate-600 text-justify leading-relaxed px-1">${data.impact}</p>
                        </div>
                    </div>
                `;
            }
        }

        renderResume();
    </script>
</body>
</html>
